<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裁板計算</title>
<meta name="description" content="把生產料單 PDF 拖進來，自動算要幾片大板與封邊條長度">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='2' fill='%23c8a26b'/%3E%3Cpath d='M12 6v20M2 16h10' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d232b;
    --muted: #5d6673;
    --line: #d9dde3;
    --accent: #1f6feb;
    --accent-weak: #e7f0ff;
    --ok: #13753a;
    --ok-bg: #e5f6ea;
    --warn: #9a4d00;
    --warn-bg: #fff3e0;
    --err: #b42318;
    --err-bg: #fdecea;
    --waste: #eceef1;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.55;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-size: 30px; margin: 4px 0 2px; letter-spacing: 1px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  h2 { font-size: 22px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .steps { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .steps { grid-template-columns: 1fr; } }
  .step-label { font-weight: 700; font-size: 20px; margin-bottom: 10px; display: block; }

  .drop {
    display: block;
    border: 3px dashed #b8c2d0; border-radius: var(--radius); padding: 18px; text-align: center;
    transition: background .15s, border-color .15s; cursor: pointer;
  }
  .drop.over { background: var(--accent-weak); border-color: var(--accent); }
  .drop .file-name { margin-top: 8px; color: var(--muted); word-break: break-all; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 10px 22px; font: inherit; font-weight: 700;
    border-radius: 10px; border: 2px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: #fff; color: var(--accent); }
  .btn.small { min-height: 40px; padding: 6px 14px; font-size: 16px; }
  .btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  input[type=file] { display: none; }
  select, input[type=number], input[type=text] {
    font: inherit; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
  }
  #specSelect { width: 100%; min-height: 52px; font-size: 20px; font-weight: 700; }
  .hint { color: var(--muted); font-size: 15px; margin: 8px 0 0; }

  .status { border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-weight: 700; display: none; }
  .status.show { display: block; }
  .status.info { background: var(--accent-weak); color: #174ea6; }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .status.err { background: var(--err-bg); color: var(--err); }
  .status ul { margin: 6px 0 0; padding-left: 22px; font-weight: 400; }

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 10px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { font-size: 16px; color: var(--muted); font-weight: 700; white-space: nowrap; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .summary td { font-size: 19px; }
  .summary .boards { font-size: 26px; font-weight: 800; color: var(--accent); }
  .summary .boards small { font-size: 16px; font-weight: 400; color: var(--text); }
  .summary select { font-size: 16px; padding: 6px 8px; }
  .summary .warn-cell { color: var(--err); font-size: 15px; font-weight: 700; display: block; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 14px; font-weight: 700; }
  .tag.a { background: #fde7c7; color: #7a4100; }
  .tag.p { background: #dcecff; color: #0b4a9c; }
  .note { color: var(--muted); font-size: 15px; margin: 12px 0 0; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

  details.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
  details.box > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; font-size: 19px; list-style: none; display: flex; align-items: center; gap: 10px; }
  details.box > summary::-webkit-details-marker { display: none; }
  details.box > summary::before { content: "▶"; font-size: 14px; color: var(--muted); transition: transform .15s; }
  details.box[open] > summary::before { transform: rotate(90deg); }
  details.box > .inner { padding: 0 18px 18px; }
  .summary-meta { color: var(--muted); font-weight: 400; font-size: 16px; }

  .boards-grid { display: grid; gap: 18px 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }
  .board-card { break-inside: avoid; page-break-inside: avoid; }
  .board-title { font-weight: 700; margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .board-title .times { color: var(--accent); }
  .board-title .fill { color: var(--muted); font-weight: 400; font-size: 16px; }
  svg.board { width: 100%; height: auto; display: block; border: 2px solid #4a5361; border-radius: 4px; background: var(--waste); }
  .grain { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  .too-big { color: var(--err); font-weight: 700; }

  .editor input[type=text], .editor input[type=number] { width: 100%; min-width: 60px; padding: 6px 8px; font-size: 16px; }
  .editor td { padding: 4px 4px; }
  .editor .w-name { min-width: 110px; }
  .editor .w-color { min-width: 150px; }
  .editor .w-code { width: 64px; }
  .del { background: none; border: 0; color: var(--err); font-size: 22px; cursor: pointer; min-height: 40px; min-width: 40px; }

  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .settings-grid label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
  .settings-grid input { max-width: 160px; }
  .spec-edit { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px 10px; align-items: center; max-width: 460px; }
  .spec-edit input { width: 100%; }

  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }
  .print-head { display: none; }

  @media print {
    body { background: #fff; font-size: 13px; }
    main { padding: 0; max-width: none; }
    .no-print, .status, header .sub { display: none !important; }
    .card, details.box { border: 0; padding: 0; margin: 0 0 10px; }
    details.box > summary { padding: 6px 0; font-size: 15px; }
    details.box > summary::before { display: none; }
    details.box > .inner { padding: 0; }
    body:not(.print-diagrams) #diagramsSection { display: none; }
    .print-head { display: block; margin-bottom: 8px; }
    .summary td { font-size: 14px; }
    .summary .boards { font-size: 18px; color: #000; }
    .summary select { border: 0; padding: 0; appearance: none; -webkit-appearance: none; font-size: 14px; }
    h1 { font-size: 20px; }
    .boards-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    svg.board { background: #fff; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>裁板計算</h1>
    <p class="sub">把生產料單 PDF 放進來，自動算出每個顏色、厚度要幾片大板，還有封邊條要多長。</p>
    <div class="print-head" id="printHead"></div>
  </header>

  <section class="steps no-print">
    <div class="card">
      <span class="step-label">① 選擇料單 PDF</span>
      <label class="drop" id="drop" for="fileInput">
        <span class="btn">選擇 PDF 檔</span>
        <div>或直接把檔案拖到這裡</div>
        <div class="file-name" id="fileName"></div>
      </label>
      <input type="file" id="fileInput" accept="application/pdf,.pdf">
    </div>
    <div class="card">
      <label class="step-label" for="specSelect">② 大板規格</label>
      <select id="specSelect"></select>
      <p class="hint">選好會記住，下次打開不用再選。</p>
    </div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="card" id="resultSection" hidden>
    <h2>計算結果</h2>
    <div class="table-wrap">
      <table class="summary">
        <thead>
          <tr>
            <th>顏色</th>
            <th class="num">厚度</th>
            <th class="num">片數</th>
            <th>大板規格</th>
            <th class="num">需要大板</th>
            <th class="num"><span class="tag a">A</span> 封邊</th>
            <th class="num"><span class="tag p">P</span> 封邊</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
    <p class="note" id="calcNote"></p>
    <div class="actions no-print">
      <button class="btn" id="printSummary" type="button">列印總表</button>
      <button class="btn secondary" id="printAll" type="button">列印總表＋排版圖</button>
    </div>
  </section>

  <section id="diagramsSection" hidden>
    <h2 class="no-print" style="margin:20px 0 10px">排版圖（點開看每片大板怎麼切）</h2>
    <div id="diagrams"></div>
  </section>

  <section class="no-print" id="toolsSection">
    <details class="box" id="editorBox" hidden>
      <summary>檢查／修改讀到的資料 <span class="summary-meta">（PDF 讀錯時才需要用）</span></summary>
      <div class="inner">
        <p class="hint" style="margin-top:0">改完會自動重算。封邊欄填像「2A」「1P」這樣，沒有就空白。</p>
        <div class="table-wrap">
          <table class="editor">
            <thead>
              <tr><th>顏色</th><th>厚</th><th>名稱</th><th>長</th><th>+封邊</th><th>寬</th><th>+封邊</th><th>數量</th><th></th></tr>
            </thead>
            <tbody id="editorBody"></tbody>
          </table>
        </div>
        <div class="actions"><button class="btn small secondary" id="addRow" type="button">＋ 新增一列</button></div>
      </div>
    </details>

    <details class="box">
      <summary>設定 <span class="summary-meta">（一般不用改）</span></summary>
      <div class="inner">
        <div class="settings-grid">
          <label>每片長、寬各加（耗材）
            <span><input type="number" id="setKerf" min="0" step="1"> mm</span></label>
          <label>封邊每邊加長
            <span><input type="number" id="setBand" min="0" step="1"> mm</span></label>
          <label>大板每邊修邊
            <span><input type="number" id="setTrim" min="0" step="1"> mm</span></label>
        </div>
        <h3 style="font-size:18px;margin:18px 0 8px">大板規格尺寸</h3>
        <div class="spec-edit" id="specEdit"></div>
        <div class="actions"><button class="btn small secondary" id="resetSettings" type="button">恢復預設值</button></div>
      </div>
    </details>
  </section>
</main>

<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
